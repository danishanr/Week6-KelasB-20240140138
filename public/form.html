<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Belanja</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>

  <nav>
    <a href="index.html">Katalog</a>
    <a href="form.html" aria-current="page">Kalkulator</a>
  </nav>

  <header>
    <h1>Kalkulator Belanja</h1>
    <p>Hitung total belanja setelah diskon. Hasil tampil otomatis saat Anda mengetik.</p>
  </header>

  <main>
    <div class="layout">

      <form id="calcForm" novalidate>
        <label for="nama">Nama Barang</label>
        <input type="text" id="nama" placeholder="contoh: Sepatu Lari" aria-describedby="nama-error">
        <small class="error" id="nama-error"></small>

        <label for="harga">Harga Satuan (Rp)</label>
        <input type="number" id="harga" placeholder="contoh: 250000" aria-describedby="harga-error">
        <small class="error" id="harga-error"></small>

        <label for="jumlah">Jumlah</label>
        <input type="number" id="jumlah" placeholder="contoh: 2" aria-describedby="jumlah-error">
        <small class="error" id="jumlah-error"></small>

        <label for="diskon">Diskon (%)</label>
        <input type="number" id="diskon" placeholder="contoh: 15" aria-describedby="diskon-error">
        <small class="error" id="diskon-error"></small>

        <div class="actions">
          <button type="submit" class="btn-primary">Simpan Perhitungan</button>
          <button type="button" class="btn-secondary" id="resetBtn">Reset</button>
        </div>
      </form>

      <div>
        <section class="panel" aria-live="polite">
          <h2>Hasil</h2>
          <div id="result" class="result">Isi form di samping untuk melihat hasil perhitungan.</div>
        </section>

        <section class="panel history">
          <div class="history-head">
            <h2>Riwayat</h2>
            <button type="button" class="btn-secondary" id="clearBtn">Hapus Semua</button>
          </div>
          <ul id="historyList"></ul>
        </section>
      </div>

    </div>
  </main>

  <footer>Kalkulator belanja &middot; HTML, CSS, dan JavaScript native</footer>

  <script src="js/form.js"></script>
</body>
</html>
